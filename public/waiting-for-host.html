<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng đợi Chủ phòng – Mini Quiz Classroom</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/waiting-for-host.css" />
  <script src="js/qrcode.min.js"></script>
</head>
<body>

<!-- ── SKY / CLOUDS ── -->
<div class="sky">
  <div class="cloud cloud-1"><svg width="260" height="80" viewBox="0 0 260 80" fill="none"><ellipse cx="130" cy="56" rx="120" ry="28" fill="white"/><ellipse cx="90" cy="42" rx="60" ry="34" fill="white"/><ellipse cx="160" cy="38" rx="52" ry="30" fill="white"/><ellipse cx="220" cy="52" rx="36" ry="22" fill="white"/><ellipse cx="40" cy="52" rx="34" ry="22" fill="white"/></svg></div>
  <div class="cloud cloud-2"><svg width="180" height="60" viewBox="0 0 180 60" fill="none"><ellipse cx="90" cy="42" rx="82" ry="20" fill="white"/><ellipse cx="60" cy="30" rx="44" ry="26" fill="white"/><ellipse cx="120" cy="28" rx="38" ry="22" fill="white"/><ellipse cx="155" cy="38" rx="24" ry="16" fill="white"/></svg></div>
  <div class="cloud cloud-3"><svg width="140" height="50" viewBox="0 0 140 50" fill="none"><ellipse cx="70" cy="36" rx="62" ry="16" fill="white"/><ellipse cx="46" cy="26" rx="34" ry="22" fill="white"/><ellipse cx="96" cy="24" rx="30" ry="20" fill="white"/></svg></div>
  <div class="cloud cloud-4"><svg width="300" height="64" viewBox="0 0 300 64" fill="none"><ellipse cx="150" cy="48" rx="138" ry="18" fill="white"/><ellipse cx="100" cy="34" rx="62" ry="28" fill="white"/><ellipse cx="200" cy="30" rx="56" ry="26" fill="white"/><ellipse cx="260" cy="44" rx="36" ry="18" fill="white"/><ellipse cx="46" cy="44" rx="40" ry="20" fill="white"/></svg></div>
  <div class="cloud cloud-5"><svg width="100" height="40" viewBox="0 0 100 40" fill="none"><ellipse cx="50" cy="28" rx="44" ry="14" fill="white"/><ellipse cx="34" cy="20" rx="24" ry="18" fill="white"/><ellipse cx="68" cy="18" rx="22" ry="16" fill="white"/></svg></div>
  <div class="cloud cloud-6"><svg width="220" height="70" viewBox="0 0 220 70" fill="none"><ellipse cx="110" cy="52" rx="100" ry="20" fill="white"/><ellipse cx="72" cy="36" rx="52" ry="30" fill="white"/><ellipse cx="148" cy="32" rx="46" ry="28" fill="white"/><ellipse cx="192" cy="48" rx="28" ry="18" fill="white"/></svg></div>
</div>

<!-- Sun / Moon -->
<div class="sky-body">
  <div class="sun-wrap">
    <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#FFD700" stroke-width="3.5" stroke-linecap="round">
        <line x1="40" y1="2"  x2="40" y2="19"/>
        <line x1="40" y1="61" x2="40" y2="78"/>
        <line x1="2"  y1="40" x2="19" y2="40"/>
        <line x1="61" y1="40" x2="78" y2="40"/>
        <line x1="13.1" y1="13.1" x2="24.9" y2="24.9"/>
        <line x1="55.1" y1="55.1" x2="66.9" y2="66.9"/>
        <line x1="66.9" y1="13.1" x2="55.1" y2="24.9"/>
        <line x1="24.9" y1="55.1" x2="13.1" y2="66.9"/>
      </g>
    </svg>
  </div>
  <div class="sun"></div>
  <div class="moon"></div>
</div>

<div class="stars" id="stars"></div>

<!-- ── HEADER ── -->
<header>
  <div class="app-title" id="app-title"></div>
  <div class="header-right">
    <button class="btn-dark" id="btn-dark" title="Chuyển chế độ tối/sáng">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="2"  x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2"  y1="12" x2="5"  y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.2" y1="4.2"  x2="6.3" y2="6.3"/>
        <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>
        <line x1="19.8" y1="4.2"  x2="17.7" y2="6.3"/>
        <line x1="6.3"  y1="17.7" x2="4.2"  y2="19.8"/>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="btn-logout" onclick="handleExitRoom()" style="background:#475569; color:#fff; border-radius:8px; padding:6px 14px; border:none; cursor:pointer; font-weight:700; font-size:0.9rem;">← Rời phòng</button>
  </div>
</header>

<!-- ── MAIN CONTENT ── -->
<main class="host-waiting-main">
  <div class="host-layout-grid">

    <!-- ══ CỘT TRÁI: KHUNG MÃ PIN & MÃ QR CHIẾU MÀN HÌNH LỚN ══ -->
    <div class="host-qr-card">

      <!-- PHẦN TRÊN: MÃ PIN (TINH GỌN, RÕ RÀNG) -->
      <div class="host-pin-section">
        <div class="host-pin-display-row">
          <span class="host-pin-code" id="pin-display">--- ---</span>
          <button class="host-pin-copy-btn" id="btn-copy-pin" onclick="copyPinCode()" title="Sao chép mã PIN">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- ĐƯỜNG KẺ PHÂN CÁCH NGANG -->
      <div class="host-card-divider"></div>

      <!-- PHẦN DƯỚI: MÃ QR KHỔNG LỒ (TỐI ĐA DIỆN TÍCH) -->
      <div class="host-qr-section">
        <div class="host-qr-wrapper" id="qr-box">
          <!-- QRCode JS render vào đây -->
        </div>
      </div>

    </div>

    <!-- ══ CỘT PHẢI: TÊN PHÒNG, SỐ LƯỢNG & DANH SÁCH THÀNH VIÊN ══ -->
    <div class="host-info-card">

      <!-- PHẦN TRÊN: TÊN PHÒNG -->
      <div class="host-title-header">
        <div class="host-title-top-row">
          <h1 class="host-room-name" id="room-name-display">Đang kết nối phòng thi...</h1>
        </div>

        <!-- ĐƯỜNG KẺ PHÂN CÁCH DƯỚI TÊN PHÒNG -->
        <div class="host-title-divider"></div>

        <!-- HÀNG PHỤ DƯỚI ĐƯỜNG KẺ: DANH SÁCH THÀNH VIÊN + SỐ LƯỢNG (x/max) -->
        <div class="host-sub-header">
          <div class="host-members-heading">
            <span>👥 Danh sách thành viên</span>
          </div>

          <div class="host-header-actions">
            <!-- Hiển thị số lượng (x/max) phía phải bên dưới tên phòng -->
            <div class="host-capacity-badge" title="Số lượng thí sinh hiện tại / Tối đa">
              <span>Sĩ số:</span>
              <span class="count-curr" id="count-curr">0</span>
              <span>/</span>
              <span id="count-max">40</span>
            </div>

            <!-- Khóa / Mở phòng -->
            <button class="btn-toggle-lock" id="btn-toggle-lock" onclick="handleToggleLock()" title="Khóa hoặc mở tiếp nhận thêm thành viên">
              <span id="lock-icon">🔓</span>
              <span id="lock-text">Đang mở</span>
            </button>
          </div>
        </div>
      </div>

      <!-- DANH SÁCH THÀNH VIÊN (DẠNG KÉO KHI ĐÔNG NGƯỜI, KHÔNG TÍNH CHỦ PHÒNG) -->
      <div class="host-members-scrollable-wrap" id="members-scroll-area">
        <div class="host-members-grid" id="members-grid">
          <div class="host-empty-members">
            <div class="host-empty-icon">⏳</div>
            <div class="host-empty-text">Chưa có thí sinh nào tham gia ...</div>
          </div>
        </div>
      </div>

      <!-- NÚT BẮT ĐẦU NGAY ĐƯA XUỐNG PHÍA DƯỚI, BỎ ICON TÊN LỬA -->
      <div class="host-bottom-actions">
        <button class="btn-start-now" id="btn-start-now" onclick="handleHostStart()" title="Bắt đầu đếm ngược bài thi ngay lập tức">
          <span>Bắt đầu ngay</span>
        </button>
      </div>

    </div>

  </div>
</main>

<!-- ── LỚP PHỦ ĐẾM NGƯỢC (COUNTDOWN OVERLAY: 5 4 3 2 1) ── -->
<div class="countdown-overlay" id="countdown-overlay">
  <div class="countdown-subhead">Bài thi chuẩn bị bắt đầu!</div>
  <div class="countdown-number" id="countdown-num">5</div>
  <div class="countdown-tip">Hệ thống đang chuẩn bị đề thi cho các thí sinh...</div>
</div>

<!-- ── TOAST THÔNG BÁO IN / OUT REALTIME ── -->
<div class="host-toast-container" id="toast-container"></div>

<footer>© 2026 Mini Quiz Classroom</footer>

<script>
  /* ── Colorize title ── */
  document.getElementById('app-title').innerHTML =
    [...'Mini Quiz Classroom'].map(ch =>
      ch === ' ' ? '<span class="space"> </span>' : '<span>' + ch + '</span>'
    ).join('');

  /* ── Dark mode ── */
  (function () {
    const btn = document.getElementById('btn-dark');
    const saved = localStorage.getItem('mqc-dark');
    if (saved === '1') document.body.classList.add('dark');
    buildStars();
    btn.addEventListener('click', function () {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('mqc-dark', isDark ? '1' : '0');
    });
    function buildStars() {
      const el = document.getElementById('stars');
      if (!el) return;
      el.innerHTML = '';
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.5 + 1;
        s.style.cssText = [
          'width:' + size + 'px',
          'height:' + size + 'px',
          'top:' + (Math.random() * 90) + '%',
          'left:' + (Math.random() * 100) + '%',
          'animation-delay:' + (Math.random() * 3) + 's',
          'animation-duration:' + (Math.random() * 2 + 1.5) + 's',
        ].join(';');
        el.appendChild(s);
      }
    }
  })();

  /* ── URL Params & Room State ── */
  const params = new URLSearchParams(location.search);
  const PIN = (params.get('pin') || '').trim();

  if (!PIN) {
    alert('Mã PIN không hợp lệ!');
    window.location.href = 'create-room.html';
  }

  document.getElementById('pin-display').textContent = PIN;

  let currentRoom = null;
  let previousMemberIds = new Set();
  let isFirstLoad = true;
  let isRoomLocked = false;
  let roomCapacity = 40;
  let pollInterval = null;
  let countdownTimer = null;
  let isStarting = false;

  /* ── Escape HTML Helper ── */
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /* ── SAO CHÉP MÃ PIN ── */
  function copyPinCode() {
    navigator.clipboard.writeText(PIN).then(() => {
      const btn = document.getElementById('btn-copy-pin');
      const oldHtml = btn.innerHTML;
      btn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      showToast('Đã sao chép mã PIN vào bộ nhớ tạm!', 'info');
      setTimeout(() => { btn.innerHTML = oldHtml; }, 1500);
    }).catch(() => {});
  }

  /* ── TOAST THÔNG BÁO IN / OUT NHANH CHÓNG ── */
  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `host-toast-item ${type}`;
    let icon = '📢';
    if (type === 'join') icon = '✨';
    if (type === 'leave') icon = '👋';

    toast.innerHTML = `<span>${icon}</span><span>${escapeHtml(message)}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(40px)';
      toast.style.transition = 'all 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, 2800);
  }

  /* ── TẠO MÃ QR LỚN CHO CHIẾU MÀN HÌNH ── */
  async function setupLargeQRCode() {
    const qrBox = document.getElementById('qr-box');
    qrBox.innerHTML = '';

    // Mã QR trỏ đến domain mini-quiz-classroom-n12.ai.studio kèm mã PIN nhập sẵn
    const baseUrl = 'https://mini-quiz-classroom-n12.ai.studio';
    const joinUrl = `${baseUrl}/index.html?pin=${encodeURIComponent(PIN)}`;

    try {
      new QRCode(qrBox, {
        text: joinUrl,
        width: 440,
        height: 440,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (err) {
      console.error('Lỗi tạo mã QR:', err);
      qrBox.innerHTML = '<div style="color:red; font-weight:700;">Không thể sinh mã QR</div>';
    }
  }

  /* ── RENDER DANH SÁCH THÀNH VIÊN (KHÔNG TÍNH CHỦ PHÒNG) ── */
  function renderMembers(players) {
    const grid = document.getElementById('members-grid');
    const countEl = document.getElementById('count-curr');
    const maxEl = document.getElementById('count-max');

    // Lọc loại bỏ chủ phòng (không tính chủ phòng theo yêu cầu đề bài)
    const members = (players || []).filter(p => !p.isHost);

    countEl.textContent = members.length;
    maxEl.textContent = roomCapacity;

    // Phát hiện thành viên In / Out nhanh chóng
    const currentMemberIds = new Set(members.map(m => m.id || m.nick));

    if (!isFirstLoad) {
      // Thành viên mới vào
      members.forEach(m => {
        const key = m.id || m.nick;
        if (!previousMemberIds.has(key)) {
          showToast(`Thí sinh "${m.nick}" vừa tham gia phòng`, 'join');
        }
      });

      // Thành viên vừa rời phòng
      previousMemberIds.forEach(oldKey => {
        if (!currentMemberIds.has(oldKey)) {
          showToast(`Một thí sinh vừa rời phòng`, 'leave');
        }
      });
    }

    previousMemberIds = currentMemberIds;
    isFirstLoad = false;

    if (members.length === 0) {
      grid.innerHTML = `
        <div class="host-empty-members">
          <div class="host-empty-icon">⏳</div>
          <div class="host-empty-text">Chưa có thí sinh nào tham gia ...</div>
        </div>
      `;
      return;
    }

    grid.innerHTML = members.map((m, index) => {
      const avId = m.av || '01';
      return `
        <div class="host-member-card" title="${escapeHtml(m.nick)}">
          <span class="host-member-order">#${index + 1}</span>
          <div class="host-member-avatar-ring">
            <img class="host-member-avatar-img" src="characters/${avId}.png" alt="${escapeHtml(m.nick)}" />
          </div>
          <div class="host-member-name">${escapeHtml(m.nick)}</div>
        </div>
      `;
    }).join('');
  }

  /* ── ĐỒNG BỘ TRẠNG THÁI KHÓA PHÒNG ── */
  function updateLockUI(locked) {
    isRoomLocked = !!locked;
    const btn = document.getElementById('btn-toggle-lock');
    const icon = document.getElementById('lock-icon');
    const text = document.getElementById('lock-text');

    if (isRoomLocked) {
      btn.classList.add('is-locked');
      icon.textContent = '🔒';
      text.textContent = 'Đang khóa';
      btn.title = 'Phòng đang khóa - Bấm để mở lại tiếp nhận thí sinh';
    } else {
      btn.classList.remove('is-locked');
      icon.textContent = '🔓';
      text.textContent = 'Đang mở';
      btn.title = 'Phòng đang mở - Bấm để khóa phòng ngăn người lạ vào';
    }
  }

  async function handleToggleLock() {
    const nextState = !isRoomLocked;
    updateLockUI(nextState);

    // Gửi cập nhật trạng thái lên server
    try {
      await fetch(`/api/rooms/${encodeURIComponent(PIN)}/lock`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isLocked: nextState })
      });
      showToast(nextState ? 'Đã khóa phòng thi thành công' : 'Đã mở phòng thi tiếp nhận thí sinh', 'info');
    } catch (e) {}
  }

  /* ── TẢI THÔNG TIN PHÒNG BAN ĐẦU & BẬT POLLING REALTIME ── */
  async function loadRoomDetails() {
    // 1. Đọc từ local cache nếu có (kiểm tra cả mqc_custom_rooms và mqc_created_rooms)
    try {
      const customRooms = JSON.parse(localStorage.getItem('mqc_custom_rooms') || '{}');
      const createdRooms = JSON.parse(localStorage.getItem('mqc_created_rooms') || '[]');
      const foundCreated = createdRooms.find(r => r.pin === PIN);
      currentRoom = customRooms[PIN] || foundCreated || null;
      if (currentRoom) {
        document.getElementById('room-name-display').textContent = currentRoom.name || currentRoom.title || 'Phòng thi trực tuyến';
        if (currentRoom.capacity) roomCapacity = Number(currentRoom.capacity);
        updateLockUI(currentRoom.isLocked);
      }
    } catch (e) {}

    // 2. Lấy dữ liệu đầy đủ từ Server (nếu server vừa restart thì tự động khôi phục lại phòng)
    try {
      const res = await fetch(`/api/rooms/${encodeURIComponent(PIN)}`);
      if (res.ok) {
        const data = await res.json();
        if (data.success && data.room) {
          currentRoom = data.room;
          document.getElementById('room-name-display').textContent = currentRoom.name || currentRoom.title || 'Phòng thi trực tuyến';
          if (currentRoom.capacity) roomCapacity = Number(currentRoom.capacity);
          updateLockUI(currentRoom.isLocked);
          renderMembers(currentRoom.players || []);
        }
      } else if (res.status === 404 && currentRoom) {
        // Tự động khôi phục đăng ký phòng lên server
        await fetch('/api/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentRoom)
        });
      }
    } catch (err) {}

    // 3. Khởi chạy Polling realtime mỗi 1000ms
    startRealtimePolling();
  }

  /* ── POLLING ĐỒNG BỘ THỜI GIAN THỰC (1000ms) ── */
  function startRealtimePolling() {
    if (pollInterval) clearInterval(pollInterval);

    pollInterval = setInterval(async () => {
      try {
        const res = await fetch(`/api/rooms/${encodeURIComponent(PIN)}/status`);
        if (res.status === 404) {
          if (currentRoom) {
            await fetch('/api/rooms', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(currentRoom)
            });
            return;
          }
          // Phòng đã bị xóa
          clearInterval(pollInterval);
          alert('Phòng thi này đã bị xóa hoặc hết hạn!');
          window.location.href = 'create-room.html';
          return;
        }

        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            if (data.title && !document.getElementById('room-name-display').textContent) {
              document.getElementById('room-name-display').textContent = data.title;
            }
            if (data.capacity) roomCapacity = Number(data.capacity);
            updateLockUI(data.isLocked);
            renderMembers(data.players || []);

            // Nếu phòng đang ở trạng thái đếm ngược mà máy chủ kích hoạt
            if (data.status === 'countdown' && !isStarting) {
              startCountdownProcess(data.countdown || 5);
            }
          }
        }
      } catch (e) {}
    }, 1000);
  }

  /* ── XỬ LÝ: CHỦ PHÒNG BẤM "BẮT ĐẦU NGAY" ── */
  async function handleHostStart() {
    if (isStarting) return;

    // Lấy số thí sinh hiện tại
    const count = previousMemberIds.size;
    if (count === 0) {
      const proceed = confirm('Phòng thi hiện chưa có thí sinh nào tham gia.\n\nBạn có chắc chắn muốn BẮT ĐẦU đếm ngược để trải nghiệm/kiểm tra không?');
      if (!proceed) return;
    }

    const btn = document.getElementById('btn-start-now');
    btn.disabled = true;
    btn.style.opacity = '0.7';

    // Ngay lập tức chuyển phòng về trạng thái khóa
    updateLockUI(true);
    try {
      const customRooms = JSON.parse(localStorage.getItem('mqc_custom_rooms') || '{}');
      if (customRooms[PIN]) {
        customRooms[PIN].isLocked = true;
        localStorage.setItem('mqc_custom_rooms', JSON.stringify(customRooms));
      }
      const createdRooms = JSON.parse(localStorage.getItem('mqc_created_rooms') || '[]');
      const r = createdRooms.find(x => x.pin === PIN);
      if (r) {
        r.isLocked = true;
        localStorage.setItem('mqc_created_rooms', JSON.stringify(createdRooms));
      }
    } catch (e) {}

    // 1. Gửi request bắt đầu lên Server (kèm thời gian đếm ngược 5s)
    try {
      await fetch(`/api/rooms/${encodeURIComponent(PIN)}/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ countdown: 5 })
      });
    } catch (err) {
      console.warn('Lỗi gọi API /start:', err);
    }

    // 2. Ghi trạng thái countdown vào localStorage để đồng bộ tức thời các tab
    try {
      localStorage.setItem(`mqc_room_status_${PIN}`, 'countdown');
    } catch (e) {}

    // 3. Khởi động màn hình đếm ngược 5 giây
    startCountdownProcess(5);
  }

  /* ── MÀN HÌNH ĐẾM NGƯỢC 5 4 3 2 1 TRÊN NỀN XÁM MỜ ── */
  function startCountdownProcess(initialSec = 5) {
    if (isStarting) return;
    isStarting = true;

    if (pollInterval) clearInterval(pollInterval);

    const overlay = document.getElementById('countdown-overlay');
    const numEl = document.getElementById('countdown-num');

    overlay.classList.add('show');

    let remain = initialSec;
    numEl.textContent = remain;

    if (countdownTimer) clearInterval(countdownTimer);

    countdownTimer = setInterval(() => {
      remain--;
      if (remain > 0) {
        numEl.textContent = remain;
        // Kích hoạt lại animation số nhảy
        numEl.style.animation = 'none';
        void numEl.offsetWidth; // trigger reflow
        numEl.style.animation = 'countNumberPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';
      } else {
        clearInterval(countdownTimer);
        numEl.textContent = 'GO!';
        numEl.style.fontSize = '8rem';

        // Sau khi đếm ngược kết thúc: Đưa chủ phòng đến room quan sát
        setTimeout(() => {
          window.location.href = `host-monitor.html?pin=${encodeURIComponent(PIN)}`;
        }, 600);
      }
    }, 1000);
  }

  /* ── RỜI PHÒNG ── */
  function handleExitRoom() {
    if (confirm('Bạn có chắc muốn rời khỏi phòng chờ của Chủ phòng? (Phòng vẫn sẽ được lưu giữ trên hệ thống)')) {
      window.location.href = 'create-room.html';
    }
  }

  // Khởi chạy khi load trang
  setupLargeQRCode();
  loadRoomDetails();
</script>
